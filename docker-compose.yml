name: lvm-weightlifting

services:
  traefik:
    image: traefik:v3.2
    container_name: lvm-traefik
    restart: unless-stopped
    command:
      - --api.dashboard=true
      - --api.insecure=true
      - --entrypoints.web.address=:80
      - --ping=true
      - --providers.file.filename=/etc/traefik/dynamic.yml
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - ./docker/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks:
      - frontend
      - backend
      - tools
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://app.localhost}
        API_PROXY_URL: ${API_PROXY_URL:-http://api:3333}
    container_name: lvm-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://app.localhost}
      API_PROXY_URL: ${API_PROXY_URL:-http://api:3333}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/login >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: lvm-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3333
      DATABASE_URL: postgresql://${POSTGRES_USER:-lvm}:${POSTGRES_PASSWORD:-lvm_local_password}@postgres:5432/${POSTGRES_DB:-lvm_weightlifting}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local_access_secret_change_me_32_chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-local_refresh_secret_change_me_32_chars}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      WEB_URL: ${WEB_URL:-http://app.localhost}
      FILE_STORAGE_DRIVER: ${FILE_STORAGE_DRIVER:-s3}
      LOCAL_STORAGE_ROOT: /app/storage
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-lvm-uploads}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-lvm_minio}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-lvm_minio_password}
      S3_FORCE_PATH_STYLE: "true"
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: "false"
      SMTP_FROM: ${SMTP_FROM:-LVM Weightlifting <no-reply@lvm.local>}
      SMTP_CONNECTION_TIMEOUT_MS: 10000
      SMTP_GREETING_TIMEOUT_MS: 10000
      SMTP_SOCKET_TIMEOUT_MS: 15000
      REDIS_URL: redis://redis:6379
      SEED_TEST_ACCOUNTS: ${SEED_TEST_ACCOUNTS:-false}
    command: >
      sh -c "npm run prisma:migrate -w @lvm/api &&
             npm run prisma:seed -w @lvm/api &&
             npm run seed:test-accounts -w @lvm/api &&
             npm run start -w @lvm/api"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - backend
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3333/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: lvm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lvm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lvm_local_password}
      POSTGRES_DB: ${POSTGRES_DB:-lvm_weightlifting}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lvm} -d ${POSTGRES_DB:-lvm_weightlifting}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: lvm-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lvm_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-lvm_minio_password}
    volumes:
      - minio_data:/data
    networks:
      - tools
      - internal
  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    container_name: lvm-minio-init
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lvm_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-lvm_minio_password}
      S3_BUCKET: ${S3_BUCKET:-lvm-uploads}
    command: >
      "until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do sleep 2; done &&
       mc mb --ignore-existing local/$$S3_BUCKET &&
       mc anonymous set none local/$$S3_BUCKET"
    depends_on:
      minio:
        condition: service_started
    networks:
      - internal

  mailpit:
    image: axllent/mailpit:v1.21.8
    container_name: lvm-mailpit
    restart: unless-stopped
    networks:
      - tools
      - internal

  redis:
    image: redis:7.4-alpine
    container_name: lvm-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  frontend:
  backend:
  tools:
  internal:
    internal: true

volumes:
  postgres_data:
  minio_data:
  redis_data:
