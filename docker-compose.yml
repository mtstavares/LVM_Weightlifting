services:
  postgres:
    image: postgres:16-alpine
    container_name: lvm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lvm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lvm}
      POSTGRES_DB: ${POSTGRES_DB:-lvm_weightlifting}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lvm} -d ${POSTGRES_DB:-lvm_weightlifting}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: lvm-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@local.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: lvm-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-lvm}:${POSTGRES_PASSWORD:-lvm}@postgres:5432/${POSTGRES_DB:-lvm_weightlifting}?schema=public
      API_PORT: ${API_PORT:-3333}
      LOCAL_STORAGE_ROOT: /app/storage
    ports:
      - "3333:3333"
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: lvm-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3333
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  pgadmin_data:
